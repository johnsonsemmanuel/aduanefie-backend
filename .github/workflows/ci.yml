name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, gd, zip
      - run: cp .env.example .env && composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: find app routes -name "*.php" -print0 | xargs -0 -n1 php -l
      - run: php artisan route:cache && php artisan route:clear
      - run: php artisan test
