server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    root /app/public;
    index index.php index.html;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Rewrite any storage path variations to /storage/$1
    location ^~ /storage/app/public/ {
        rewrite ^/storage/app/public/(.*)$ /storage/$1 last;
    }

    location ^~ /public/storage/ {
        rewrite ^/public/storage/(.*)$ /storage/$1 last;
    }

    # Handle /public/ prefix generated by 6amMart template asset() helpers
    location ^~ /public/ {
        rewrite ^/public/(.*)$ /$1 last;
    }

    # Serve static assets directly with proper caching and CORS headers (fonts/assets across admin/web subdomains)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri =404;
    }

    location ~* /(actuator|@vite|trace\.axd|wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|wlwmanifest\.xml|debug/default|vendor/phpunit|download/resources|eval-stdin\.php) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
